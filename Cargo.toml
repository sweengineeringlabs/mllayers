[package]
name = "mllayers"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["sweengineeringlabs <engineers@swelabs.io>"]
description = "Neural network layers — Linear, Conv1d, LayerNorm, BatchNorm, activations, Dropout, Sequential"
keywords = ["machine-learning", "neural-network", "layers", "deep-learning"]
categories = ["science", "mathematics"]

[lib]
path = "src/lib.rs"

[dependencies]
swe-ml-tensor = { package = "llmtensor", git = "https://github.com/sweengineeringlabs/llmtensor", rev = "3f2fb98" }
mlautograd = { git = "https://github.com/sweengineeringlabs/mlautograd" }
thiserror = "2"
rand = "0.8"
